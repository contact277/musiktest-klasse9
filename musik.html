ype="'+(multiple?'checkbox':'radio')+'" name="answer" value="'+i+'" '+((A[n]||[]).includes(i)?'checked':'')+'><span>'+esc(o)+'</span></label>').join('')+'<div class="actions"><button class="secondary" id="back" '+(n===0?'disabled':'')+'>Zurück</button><button id="next">'+(n===Q.length-1?'Test abgeben':'Weiter')+'</button></div>';document.querySelectorAll('input[name=answer]').forEach(el=>el.onchange=()=>{A[n]=[...document.querySelectorAll('input[name=answer]:checked')].map(x=>Number(x.value))});document.getElementById('back').onclick=()=>{n--;render()};document.getElementById('next').onclick=()=>{if(!(A[n]||[]).length){alert('Bitte zuerst eine Antwort auswählen.');return}n++;render()}}render();</script></body></html>
